
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Yadav Code Playground</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/selection/active-line.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a;--bg2:#111827;--bg3:#1e293b;--border:#2d3748;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --cyan:#06b6d4;--purple:#a855f7;
  --text:#e2e8f0;--muted:#64748b;
}
html,body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;height:100vh;overflow:hidden}

/* ═══ HEADER ═══ */
.hdr{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:relative;z-index:100}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#f59e0b,#10b981);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-txt{font-size:14px;font-weight:700;letter-spacing:1.5px}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.actions{display:flex;gap:6px;align-items:center}
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.run{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent;color:#fff}
.btn.run:hover{color:#fff;box-shadow:0 0 15px rgba(16,185,129,.4)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.save:hover{border-color:var(--blue);color:var(--blue)}

/* ═══ MAIN LAYOUT ═══ */
.main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 52px);overflow:hidden}
.pane{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pane-left{border-right:1px solid var(--border)}
.pane-right{background:var(--bg)}

/* ═══ TABS ═══ */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;background:transparent;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:1px;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--text);border-bottom-color:var(--amber);background:var(--bg3)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.tab.active .dot{background:var(--amber)}
.tab[data-lang="html"] .dot{background:#e44d26}
.tab[data-lang="css"] .dot{background:#264de4}
.tab[data-lang="js"] .dot{background:#f7df1e}

/* ═══ EDITOR ═══ */
.editor-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.editor{display:none;height:100%;width:100%}
.editor.active{display:block}
.CodeMirror{height:100%!important;font-family:'JetBrains Mono',monospace!important;font-size:13px!important;background:var(--bg)!important;color:var(--text)!important;line-height:1.6}
.CodeMirror-gutters{background:var(--bg2)!important;border-right:1px solid var(--border)!important}
.CodeMirror-linenumber{color:var(--muted)!important;font-size:11px}
.CodeMirror-cursor{border-left:2px solid var(--green)!important}
.CodeMirror-selected{background:rgba(59,130,246,.25)!important}
.CodeMirror-activeline-background{background:rgba(255,255,255,.02)!important}
.cm-keyword{color:#c084fc!important}
.cm-string{color:#86efac!important}
.cm-number{color:#fbbf24!important}
.cm-comment{color:#64748b!important;font-style:italic}
.cm-tag{color:#f87171!important}
.cm-attribute{color:#fbbf24!important}
.cm-property{color:#60a5fa!important}
.cm-variable{color:#e2e8f0!important}
.cm-def{color:#22d3ee!important}
.cm-operator{color:#f472b6!important}
.cm-atom{color:#fbbf24!important}
.cm-builtin{color:#a78bfa!important}
.cm-punctuation{color:#94a3b8!important}

/* ═══ PREVIEW ═══ */
.preview-header{height:38px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px}
.preview-header .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700}
.preview-header .status{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--green);display:flex;align-items:center;gap:5px}
.preview-header .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#preview{flex:1;border:none;background:#fff;width:100%}

/* ═══ CONSOLE ═══ */
.console{height:140px;background:#050810;border-top:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.console-hdr{padding:6px 12px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;border-bottom:1px solid var(--border)}
.console-hdr .clear-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;padding:2px 6px}
.console-hdr .clear-btn:hover{color:var(--red)}
.console-body{flex:1;overflow-y:auto;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6}
.console-line{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:8px}
.console-line .time{color:var(--muted);flex-shrink:0;font-size:10px}
.console-line.log{color:var(--text)}
.console-line.error{color:#f87171}
.console-line.warn{color:#fbbf24}
.console-line.info{color:#60a5fa}
.console-line.success{color:#86efac}

/* ═══ MOBILE ═══ */
.mobile-tabs{display:none}
@media(max-width:768px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .pane-left{border-right:none;border-bottom:1px solid var(--border)}
  .logo-sub{display:none}
  .btn{padding:7px 9px;font-size:9px}
  .btn .btxt{display:none}
  .actions{gap:4px}
  .console{height:100px}
}
@media(max-width:480px){
  .hdr{padding:0 8px}
  .logo-txt{font-size:12px;letter-spacing:1px}
  .logo-icon{width:28px;height:28px;font-size:14px}
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="hdr">
  <div class="logo">
    <div class="logo-icon">💻</div>
    <div>
      <div class="logo-txt">YADAV CODE</div>
      <div class="logo-sub">PLAYGROUND</div>
    </div>
  </div>
  <div class="actions">
    <button class="btn save" onclick="saveProject()">💾 <span class="btxt">Save</span></button>
    <button class="btn" onclick="loadProject()">📂 <span class="btxt">Load</span></button>
    <button class="btn" onclick="downloadHTML()">⬇ <span class="btxt">Export</span></button>
    <button class="btn danger" onclick="clearAll()">🗑 <span class="btxt">Clear</span></button>
    <button class="btn run" onclick="runCode()">▶ <span class="btxt">RUN</span></button>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">
  <!-- LEFT: EDITOR -->
  <div class="pane pane-left">
    <div class="tabs">
      <button class="tab active" data-lang="html" onclick="switchTab('html')"><span class="dot"></span>index.html</button>
      <button class="tab" data-lang="css" onclick="switchTab('css')"><span class="dot"></span>style.css</button>
      <button class="tab" data-lang="js" onclick="switchTab('js')"><span class="dot"></span>script.js</button>
    </div>
    <div class="editor-wrap">
      <textarea id="editor-html" class="editor active"></textarea>
      <textarea id="editor-css" class="editor"></textarea>
      <textarea id="editor-js" class="editor"></textarea>
    </div>
    <div class="console">
      <div class="console-hdr">
        <span>⚡ CONSOLE</span>
        <button class="clear-btn" onclick="clearConsole()">CLEAR</button>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </div>
  </div>

  <!-- RIGHT: PREVIEW -->
  <div class="pane pane-right">
    <div class="preview-header">
      <span class="lbl">🔍 LIVE PREVIEW</span>
      <span class="status"><span class="dot"></span>RUNNING</span>
    </div>
    <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  YADAV CODE PLAYGROUND — Core Engine
// ═══════════════════════════════════════════════════════════════════

const DEFAULT_HTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🚀 Hello, Yadav!</h1>
    <p>Yahan apna HTML likho aur live preview dekho.</p>
    <button onclick="greet()">Click Me</button>
    <div id="output"></div>
  </div>
  <script src="script.js"><\/script>
</body>
</html>`;

const DEFAULT_CSS = `body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #e2e8f0;
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  text-align: center;
  max-width: 400px;
}
h1 { color: #10b981; margin-bottom: 12px; }
p { color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
button {
  background: #10b981;
  color: #fff;
  border: none;
  padding: 12px 28px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
button:hover {
  background: #059669;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(16,185,129,0.3);
}
#output { margin-top: 20px; font-weight: bold; color: #fbbf24; }`;

const DEFAULT_JS = `function greet() {
  console.log("Button clicked! 🎉");
  const output = document.getElementById('output');
  output.textContent = "Namaste from Yadav Code! 🚀";
  output.style.fontSize = "20px";
}

console.log("🚀 Yadav Code Playground ready!");
console.log("Aap HTML, CSS, aur JS directly likh sakte ho.");`;

let editors = {};
let currentLang = 'html';

// ─── INIT EDITORS ────────────────────────────────────────────────────
function initEditors() {
  const configs = {
    html: { mode: 'htmlmixed', value: DEFAULT_HTML },
    css:  { mode: 'css',       value: DEFAULT_CSS },
    js:   { mode: 'javascript', value: DEFAULT_JS }
  };
  
  ['html', 'css', 'js'].forEach(lang => {
    editors[lang] = CodeMirror.fromTextArea(document.getElementById('editor-' + lang), {
      mode: configs[lang].mode,
      theme: 'default',
      lineNumbers: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      styleActiveLine: true,
      indentUnit: 2,
      tabSize: 2,
      lineWrapping: true,
      value: configs[lang].value
    });
    editors[lang].setValue(configs[lang].value);
    
    // Auto-save on change
    editors[lang].on('change', () => {
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => autoSave(), 1500);
    });
  });
}

// ─── SWITCH TABS ─────────────────────────────────────────────────────
function switchTab(lang) {
  currentLang = lang;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
  document.querySelectorAll('.editor').forEach(e => e.classList.remove('active'));
  document.getElementById('editor-' + lang).classList.add('active');
  setTimeout(() => editors[lang].refresh(), 10);
}

// ─── CONSOLE LOGGING ─────────────────────────────────────────────────
function logToConsole(msg, type = 'log') {
  const body = document.getElementById('consoleBody');
  const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const line = document.createElement('div');
  line.className = 'console-line ' + type;
  line.innerHTML = `<span class="time">[${time}]</span><span>${escapeHtml(String(msg))}</span>`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function clearConsole() {
  document.getElementById('consoleBody').innerHTML = '';
  logToConsole('Console cleared.', 'info');
}

// ─── RUN CODE ────────────────────────────────────────────────────────
function runCode() {
  const html = editors.html.getValue();
  const css = editors.css.getValue();
  const js = editors.js.getValue();
  
  logToConsole('▶ Running code...', 'info');
  
  // Inject console interception into the iframe
  const consoleInterceptor = `
    <script>
      (function() {
        const origLog = console.log;
        const origErr = console.error;
        const origWarn = console.warn;
        const origInfo = console.info;
        
        function send(type, args) {
          try {
            const msg = Array.from(args).map(a => {
              if (typeof a === 'object') {
                try { return JSON.stringify(a, null, 2); } catch(e) { return String(a); }
              }
              return String(a);
            }).join(' ');
            parent.postMessage({ __yadavConsole: true, type: type, msg: msg }, '*');
          } catch(e) {}
        }
        
        console.log = function() { send('log', arguments); origLog.apply(console, arguments); };
        console.error = function() { send('error', arguments); origErr.apply(console, arguments); };
        console.warn = function() { send('warn', arguments); origWarn.apply(console, arguments); };
        console.info = function() { send('info', arguments); origInfo.apply(console, arguments); };
        
        window.addEventListener('error', function(e) {
          send('error', ['Uncaught: ' + e.message + ' (line ' + e.lineno + ')']);
        });
      })();
    <\/script>
  `;
  
  // Build final HTML
  let finalHTML = html;
  
  // Replace external css/js links with inline content
  finalHTML = finalHTML.replace(/<link[^>]*href=["']style\.css["'][^>]*>/gi, `<style>${css}</style>`);
  finalHTML = finalHTML.replace(/<script[^>]*src=["']script\.js["'][^>]*><\/script>/gi, `<script>${js}<\/script>`);
  
  // If no inline style tag was added and CSS is non-empty, add it
  if (css.trim() && !finalHTML.includes('<style>')) {
    finalHTML = finalHTML.replace('</head>', `<style>${css}</style></head>`);
  }
  
  // If no inline script was added and JS is non-empty, add it
  if (js.trim() && !finalHTML.includes('<' + 'script>') ) {
    finalHTML = finalHTML.replace('</body>', `<script>${js}<\/script></body>`);
  }
  
  // Inject console interceptor at the very top
  finalHTML = finalHTML.replace(/<head>/i, '<head>' + consoleInterceptor);
  
  // Write to iframe
  const iframe = document.getElementById('preview');
  iframe.srcdoc = finalHTML;
  
  logToConsole('✓ Code executed successfully.', 'success');
}

// ─── MESSAGE LISTENER (for iframe console) ──────────────────────────
window.addEventListener('message', (e) => {
  if (e.data && e.data.__yadavConsole) {
    logToConsole(e.data.msg, e.data.type);
  }
});

// ─── SAVE / LOAD (localStorage) ──────────────────────────────────────
function autoSave() {
  try {
    const project = {
      html: editors.html.getValue(),
      css: editors.css.getValue(),
      js: editors.js.getValue(),
      savedAt: new Date().toISOString()
    };
    localStorage.setItem('yadavCodeProject', JSON.stringify(project));
    logToConsole('💾 Auto-saved', 'info');
  } catch (e) {
    logToConsole('Auto-save failed: ' + e.message, 'error');
  }
}

function saveProject() {
  try {
    const project = {
      html: editors.html.getValue(),
      css: editors.css.getValue(),
      js: editors.js.getValue(),
      savedAt: new Date().toISOString()
    };
    localStorage.setItem('yadavCodeProject', JSON.stringify(project));
    
    // Also download as JSON for backup
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'yadav-code-project-' + Date.now() + '.json';
    a.click();
    
    logToConsole('✓ Project saved to localStorage + downloaded', 'success');
    showToast('✅ Project saved!');
  } catch (e) {
    logToConsole('Save failed: ' + e.message, 'error');
  }
}

function loadProject() {
  // Try localStorage first
  const saved = localStorage.getItem('yadavCodeProject');
  if (saved) {
    try {
      const p = JSON.parse(saved);
      editors.html.setValue(p.html || '');
      editors.css.setValue(p.css || '');
      editors.js.setValue(p.js || '');
      logToConsole('✓ Project loaded from localStorage (saved at ' + new Date(p.savedAt).toLocaleString() + ')', 'success');
      showToast('✅ Project loaded!');
      runCode();
      return;
    } catch (e) {
      logToConsole('Load failed: ' + e.message, 'error');
    }
  } else {
    logToConsole('No saved project found. Loading default template.', 'warn');
    resetToDefault();
  }
}

function resetToDefault() {
  editors.html.setValue(DEFAULT_HTML);
  editors.css.setValue(DEFAULT_CSS);
  editors.js.setValue(DEFAULT_JS);
  logToConsole('Reset to default template.', 'info');
  runCode();
}

function clearAll() {
  if (!confirm('Are you sure? This will erase all your code!')) return;
  editors.html.setValue('');
  editors.css.setValue('');
  editors.js.setValue('');
  localStorage.removeItem('yadavCodeProject');
  logToConsole('🗑 All code cleared.', 'warn');
  runCode();
}

// ─── EXPORT AS SINGLE HTML ──────────────────────────────────────────
function downloadHTML() {
  const html = editors.html.getValue();
  const css = editors.css.getValue();
  const js = editors.js.getValue();
  
  let finalHTML = html;
  finalHTML = finalHTML.replace(/<link[^>]*href=["']style\.css["'][^>]*>/gi, `<style>${css}</style>`);
  finalHTML = finalHTML.replace(/<script[^>]*src=["']script\.js["'][^>]*><\/script>/gi, `<script>${js}<\/script>`);
  
  if (css.trim() && !finalHTML.includes('<style>')) {
    finalHTML = finalHTML.replace('</head>', `<style>${css}</style></head>`);
  }
  if (js.trim() && !finalHTML.includes('<script>')) {
    finalHTML = finalHTML.replace('</body>', `<script>${js}<\/script></body>`);
  }
  
  const blob = new Blob([finalHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yadav-code-export-' + Date.now() + '.html';
  a.click();
  
  logToConsole('✓ Exported as standalone HTML file.', 'success');
  showToast('✅ Exported!');
}

// ─── TOAST ──────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed;top:70px;left:50%;transform:translateX(-50%);
    background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    z-index:9999;box-shadow:0 8px 30px rgba(16,185,129,0.4);
    opacity:0;transition:opacity 0.3s;
  `;
  document.body.appendChild(t);
  setTimeout(() => t.style.opacity = '1', 10);
  setTimeout(() => {
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

// ─── KEYBOARD SHORTCUTS ─────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Ctrl+Enter: Run
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
  // Ctrl+S: Save
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    saveProject();
  }
  // Tab switching: Ctrl+1/2/3
  if (e.ctrlKey && e.key === '1') { e.preventDefault(); switchTab('html'); }
  if (e.ctrlKey && e.key === '2') { e.preventDefault(); switchTab('css'); }
  if (e.ctrlKey && e.key === '3') { e.preventDefault(); switchTab('js'); }
});

// ─── BOOT ───────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  initEditors();
  
  // Try to load saved project
  const saved = localStorage.getItem('yadavCodeProject');
  if (saved) {
    try {
      const p = JSON.parse(saved);
      editors.html.setValue(p.html || DEFAULT_HTML);
      editors.css.setValue(p.css || DEFAULT_CSS);
      editors.js.setValue(p.js || DEFAULT_JS);
      logToConsole('✓ Restored previous session', 'success');
    } catch(e) {
      logToConsole('Could not restore previous session', 'warn');
    }
  }
